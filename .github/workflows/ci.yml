name: CI

# Every surface lives in its own top-level folder and has its own job. A
# pull request runs a surface's job only when that surface (or the workflow
# itself) changes; pushes to main, the weekly schedule and manual dispatch run
# every job. The `ci` job always runs and is the single required check, so a
# skipped surface never leaves a missing status. The release workflow calls
# this workflow as its gate and passes the `surface` it releases: only that
# surface's jobs run, plus `packaging`, which tests the scripts every release
# uses. The plugin archive embeds the launcher scripts, so a plugin release also
# runs the launcher checks. A call without a surface runs every job.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      surface:
        description: "Release surface (web, launchers or plugin); empty runs every job"
        required: false
        type: string
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plugin: ${{ steps.filter.outputs.plugin }}
      launchers: ${{ steps.filter.outputs.launchers }}
      web: ${{ steps.filter.outputs.web }}
      packaging: ${{ steps.filter.outputs.packaging }}
      macos_package: ${{ steps.filter.outputs.macos_package }}
    steps:
      # Only pull requests read the filter outputs; every other event runs all
      # jobs, so a tag push (the release gate) needs no path comparison.
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'pull_request' }}
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        with:
          filters: |
            plugin:
              - 'plugin/**'
              - 'launchers/**'
              - 'web/core-sdk.json'
              - '.github/workflows/ci.yml'
            launchers:
              - 'launchers/**'
              - 'packaging/core-pin'
              - 'web/core-sdk.json'
              - 'web/package.json'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'packaging/**'
              - '.github/workflows/ci.yml'
            packaging:
              - 'packaging/**'
              - 'plugin/**'
              - 'launchers/**'
              - 'web/core-sdk.json'
              - 'web/package.json'
              - 'web/packaging/**'
              - 'web/release/**'
              - '.github/workflows/**'
            macos_package:
              - 'packaging/**'
              - 'web/core-sdk.json'
              - 'web/package.json'
              - 'web/packaging/**'
              - 'web/release/**'
              - '.github/workflows/ci.yml'

  plugin:
    needs: changes
    if: ${{ (github.event_name == 'pull_request' && needs.changes.outputs.plugin == 'true') || (github.event_name != 'pull_request' && (inputs.surface == '' || inputs.surface == 'plugin' || inputs.surface == 'launchers')) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: plugin/package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # `bun run test` runs the suite under a private TMPDIR and fails on leftovers.
      - run: bun run test

  launchers:
    needs: changes
    if: ${{ (github.event_name == 'pull_request' && needs.changes.outputs.launchers == 'true') || (github.event_name != 'pull_request' && (inputs.surface == '' || inputs.surface == 'launchers' || inputs.surface == 'plugin')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shell: dash, render: true }
          - { os: ubuntu-latest, shell: bash, render: true }
          - { os: macos-latest, shell: /bin/sh, render: false }
    runs-on: ${{ matrix.os }}
    env:
      # The rendering tests drive the real `pohunek prompt` CLI; this is the
      # core release they are pinned to. Bump it together with the digest.
      POHUNEK_RELEASE: v0.33.1
      POHUNEK_MUSL_SHA256: 2b700b305007321f4d931cf995cc7cfdab50ad6da5540a03baeb43433b4efd25
    defaults:
      run:
        working-directory: launchers
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: launchers/package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - name: Check the launcher release against the shared core pin
        if: ${{ matrix.render }}
        run: |
          set -euo pipefail
          core_ref="$(../packaging/core-pin --web ../web/core-sdk.json | sed -n 's/^core_ref=//p')"
          if [[ "$core_ref" == v* && "$POHUNEK_RELEASE" != "$core_ref" ]]; then
            echo "::error::launcher release $POHUNEK_RELEASE differs from core pin $core_ref"
            exit 1
          fi
      - name: Install the pohunek release binary
        if: ${{ matrix.render }}
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="pohunek-cli-${POHUNEK_RELEASE#v}-x86_64-unknown-linux-musl.tar.gz"
          gh release download "$POHUNEK_RELEASE" -R zajca/pohunek -p "$asset"
          echo "$POHUNEK_MUSL_SHA256  $asset" | sha256sum -c -
          tar xzf "$asset"
          echo "POHUNEK_TEST_BIN=$PWD/${asset%.tar.gz}/pohunek" >> "$GITHUB_ENV"
      - name: Launcher tests under ${{ matrix.shell }}
        env:
          POHUNEK_TEST_SHELL: ${{ matrix.shell }}
        run: |
          if [ "${{ matrix.render }}" = "true" ]; then
            bun run test
          else
            bun run test tests/launcher-scripts.test.ts tests/lib-timeout.test.ts
          fi

  # The release packaging scripts shared by every surface. The web surface's
  # filter lists `packaging/**` too, because its installer tests run the
  # manifest and verification scripts from there; the filter also lists
  # `plugin/**` and `launchers/**` because the plugin archive tests stage the
  # real sources.
  packaging:
    needs: changes
    if: ${{ (github.event_name == 'pull_request' && needs.changes.outputs.packaging == 'true') || (github.event_name != 'pull_request' && (inputs.surface == '' || inputs.surface == 'web' || inputs.surface == 'launchers' || inputs.surface == 'plugin')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Packaging script tests
        run: python3 -m unittest discover -s packaging/tests

      - name: Lint the workflows and their shell steps
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

      # Error severity only: the scripts use the `CDPATH= cd` idiom, which
      # shellcheck reports as a warning.
      - name: Shellcheck the packaging scripts
        run: |
          shellcheck --severity=error \
            packaging/archive packaging/stage-archive packaging/write-manifest \
            packaging/verify-archive packaging/make-archive \
            packaging/macos/audit-macho packaging/macos/package \
            packaging/macos/sign packaging/macos/verify-signed \
            web/release/package.sh web/release/install.sh

  # The web control center against the core revision pinned in web/core-sdk.json:
  # the SDK tarballs are packed from that revision and served from the loopback
  # address the pin names, so `bun install --frozen-lockfile` verifies the
  # lockfile integrity against reproducible bytes. The real daemon, worker and
  # CLI come from the same revision.
  web:
    needs: changes
    if: ${{ (github.event_name == 'pull_request' && needs.changes.outputs.web == 'true') || (github.event_name != 'pull_request' && (inputs.surface == '' || inputs.surface == 'web')) }}
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Resolve the pinned core revision
        id: core
        run: echo "rev=$(jq -r .coreRev core-sdk.json)" >> "$GITHUB_OUTPUT"

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock', 'web/package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Restore the core binaries
        uses: actions/cache@v4
        with:
          path: web/.core-sdk/core-binaries
          key: web-core-binaries-${{ runner.os }}-${{ steps.core.outputs.rev }}

      # Reuses the restored binaries; otherwise builds them from the pinned
      # revision. The worker lands beside the daemon.
      - name: Build the core binaries
        shell: bash
        run: bun scripts/build-core-binaries.ts | sed -e 's/^export //' -e "s/'//g" >> "$GITHUB_ENV"

      - name: Pack the core SDK tarballs twice and compare
        run: bun scripts/pack-core-sdk.ts --verify-reproducible

      - name: Check the package.json catalog against the pin
        run: bun scripts/sync-core-sdk.ts --check

      - name: Install web dependencies
        run: bun scripts/serve-core-sdk.ts --run bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Integration tests
        run: bun test

      # The lockfile pins Playwright, so the browser build follows bun.lock.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install Playwright Chromium
        run: bunx playwright install --only-shell chromium

      - name: Browser end-to-end tests
        run: bun run test:e2e

      - name: Backend end-to-end against the real daemon
        run: bun test backend/test/real-daemon.e2e.test.ts
        env:
          POHUNEK_E2E: "1"

      # The release archive for the host platform: builds the SPA, compiles the
      # backend, smoke-tests it against a fixture daemon, and audits the archive.
      - name: Package and audit the release archive
        env:
          POHUNEK_CORE_REF: ${{ steps.core.outputs.rev }}
        run: |
          set -euo pipefail
          bash release/package.sh 0.0.0 linux-x86_64
          ../packaging/check-archive dist/pohunek-web-0.0.0-linux-x86_64.tar.gz \
            --component web --version 0.0.0 --target x86_64-unknown-linux-gnu --core "$POHUNEK_CORE_REF"

  # The compiled backend and the browser suite on Apple Silicon, against the
  # real macOS pohunekd, pohunek-sessiond and pohunek. The runner is ephemeral,
  # so the backend suite may also exercise the owner default runtime directory
  # (`/private/tmp/pohunek-<uid>`), which a developer's own daemon would share.
  web-macos:
    needs: changes
    if: ${{ (github.event_name == 'pull_request' && needs.changes.outputs.web == 'true') || (github.event_name != 'pull_request' && (inputs.surface == '' || inputs.surface == 'web')) }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        run: test "$(uname -m)" = "arm64"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Resolve the pinned core revision
        id: core
        run: echo "rev=$(jq -r .coreRev core-sdk.json)" >> "$GITHUB_OUTPUT"

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'web/package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore the core binaries
        uses: actions/cache@v4
        with:
          path: web/.core-sdk/core-binaries
          key: web-core-binaries-${{ runner.os }}-${{ runner.arch }}-${{ steps.core.outputs.rev }}

      - name: Build the core binaries
        shell: bash
        run: bun scripts/build-core-binaries.ts | sed -e 's/^export //' -e "s/'//g" >> "$GITHUB_ENV"

      - name: Pack the core SDK tarballs
        run: bun scripts/pack-core-sdk.ts

      - name: Install web dependencies
        run: bun scripts/serve-core-sdk.ts --run bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Integration tests
        run: bun test

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock') }}

      - name: Install Playwright Chromium
        run: bunx playwright install --only-shell chromium

      - name: Browser end-to-end tests
        run: bun run test:e2e

      # The release package ships this executable: compile it for the native
      # target and smoke it against a fixture daemon, outside the workspace
      # runtime.
      - name: Compile and smoke the packaged backend
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pohunek-web-smoke"
          rm -rf "$out"
          mkdir -p "$out"
          bun build --compile --target=bun-darwin-arm64 \
            --no-compile-autoload-dotenv --no-compile-autoload-bunfig \
            --outfile="$out/pohunek-web" ./backend/src/entrypoint.ts
          file "$out/pohunek-web" | tee /dev/stderr | grep -q "arm64"
          bun run release/smoke.ts "$out/pohunek-web" frontend/dist

      - name: Backend end-to-end against the real daemon
        run: bun test backend/test/real-daemon.e2e.test.ts
        env:
          POHUNEK_E2E: "1"
          POHUNEK_E2E_DEFAULT_RUNTIME: "1"

  # The macOS release packaging path with the real codesign: web is
  # staged, ad-hoc signed by `package --adhoc-release`, and the archive is
  # checked and extracted so `verify-signed --adhoc` inspects the shipped bytes.
  # The path filter is wider than the surface jobs because the signing scripts
  # only run for real here.
  macos-package:
    name: macOS ad-hoc signing (web)
    needs: changes
    if: ${{ (github.event_name == 'pull_request' && needs.changes.outputs.macos_package == 'true') || (github.event_name != 'pull_request' && (inputs.surface == '' || inputs.surface == 'web')) }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      COMPONENT: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        run: test "$(uname -m)" = "arm64"

      - name: Resolve the version and the core pin
        id: pin
        run: |
          set -euo pipefail
          packaging/core-pin | tee -a "$GITHUB_OUTPUT"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Pack the core SDK tarballs
        working-directory: web
        run: bun scripts/pack-core-sdk.ts

      - name: Install web dependencies
        working-directory: web
        run: bun scripts/serve-core-sdk.ts --run bun install --frozen-lockfile

      - name: Build the web control center input tree
        id: webinput
        env:
          VERSION: ${{ steps.pin.outputs.web_version }}
        run: bash web/release/package.sh "$VERSION" aarch64-apple-darwin --input-only

      - name: Stage, ad-hoc sign, and verify
        id: package
        env:
          VERSION: ${{ steps.pin.outputs.web_version }}
          POHUNEK_CORE_REF: ${{ steps.pin.outputs.core_ref }}
          WEB_INPUT: ${{ steps.webinput.outputs.input }}
        run: |
          set -euo pipefail
          input="$WEB_INPUT"
          mkdir -p dist
          staging="$(packaging/macos/package --stage-release "$COMPONENT" "$VERSION" "$input" dist)"
          archive="$(packaging/macos/package --adhoc-release "$COMPONENT" "$VERSION" "$staging")"
          packaging/macos/verify-signed --adhoc "$staging"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Check the archive and verify the extracted signatures
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          VERSION: ${{ steps.pin.outputs.web_version }}
          POHUNEK_CORE_REF: ${{ steps.pin.outputs.core_ref }}
        run: |
          set -euo pipefail
          packaging/check-archive "$ARCHIVE" --component "$COMPONENT" --version "$VERSION" \
            --target aarch64-apple-darwin --signing adhoc --core "$POHUNEK_CORE_REF"
          extract_dir="$(mktemp -d)"
          trap 'rm -rf "$extract_dir"' EXIT
          tar -xzf "$ARCHIVE" -C "$extract_dir"
          root="$extract_dir/$(basename "$ARCHIVE" .tar.gz)"
          grep -q '^signing adhoc$' "$root/MANIFEST"
          packaging/macos/verify-signed --adhoc "$root"

  ci:
    if: ${{ always() }}
    needs: [changes, plugin, launchers, web, web-macos, packaging, macos-package]
    runs-on: ubuntu-latest
    steps:
      # A skipped surface job is a pass; a failed or cancelled one is not.
      - name: Require every surface job to have passed or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "job result: $r"; exit 1 ;;
            esac
          done
