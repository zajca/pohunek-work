name: CI

# Every surface lives in its own top-level folder and has its own job. A
# pull request runs a surface's job only when that surface (or the workflow
# itself) changes; pushes to main, the weekly schedule and manual dispatch run
# every job. The `ci` job always runs and is the single required check, so a
# skipped surface never leaves a missing status. The release workflow calls
# this workflow as its gate; a call from a tag push runs every job.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plugin: ${{ steps.filter.outputs.plugin }}
      launchers: ${{ steps.filter.outputs.launchers }}
      native: ${{ steps.filter.outputs.native }}
      web: ${{ steps.filter.outputs.web }}
      packaging: ${{ steps.filter.outputs.packaging }}
      macos_package: ${{ steps.filter.outputs.macos_package }}
    steps:
      # Only pull requests read the filter outputs; every other event runs all
      # jobs, so a tag push (the release gate) needs no path comparison.
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'pull_request' }}
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        with:
          filters: |
            plugin:
              - 'plugin/**'
              - 'launchers/**'
              - '.github/workflows/ci.yml'
            launchers:
              - 'launchers/**'
              - '.github/workflows/ci.yml'
            native:
              - 'native/**'
              - 'packaging/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'packaging/**'
              - '.github/workflows/ci.yml'
            packaging:
              - 'packaging/**'
              - 'native/packaging/**'
              - 'web/packaging/**'
              - 'native/scripts/**'
              - 'web/release/**'
              - '.github/workflows/**'
            macos_package:
              - 'packaging/**'
              - 'native/packaging/**'
              - 'web/packaging/**'
              - 'web/release/**'
              - '.github/workflows/ci.yml'

  plugin:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.plugin == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: plugin/package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

  launchers:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.launchers == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shell: dash, render: true }
          - { os: ubuntu-latest, shell: bash, render: true }
          - { os: macos-latest, shell: /bin/sh, render: false }
    runs-on: ${{ matrix.os }}
    env:
      # The rendering tests drive the real `pohunek prompt` CLI; this is the
      # core release they are pinned to. Bump it together with the digest.
      POHUNEK_RELEASE: v0.33.0
      POHUNEK_MUSL_SHA256: 6075ad7f85883c234c70866c002aef07356fbaab4dd9d4acbbd30b415288e006
    defaults:
      run:
        working-directory: launchers
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: launchers/package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - name: Install the pohunek release binary
        if: ${{ matrix.render }}
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="pohunek-cli-${POHUNEK_RELEASE#v}-x86_64-unknown-linux-musl.tar.gz"
          gh release download "$POHUNEK_RELEASE" -R zajca/pohunek -p "$asset"
          echo "$POHUNEK_MUSL_SHA256  $asset" | sha256sum -c -
          tar xzf "$asset"
          echo "POHUNEK_TEST_BIN=$PWD/${asset%.tar.gz}/pohunek" >> "$GITHUB_ENV"
      - name: Launcher tests under ${{ matrix.shell }}
        env:
          POHUNEK_TEST_SHELL: ${{ matrix.shell }}
        run: |
          if [ "${{ matrix.render }}" = "true" ]; then
            bun test
          else
            bun test tests/launcher-scripts.test.ts tests/lib-timeout.test.ts
          fi

  # The release packaging scripts shared by native/ and web/. The web surface's
  # filter lists `packaging/**` too, because its installer tests run the
  # manifest and verification scripts from there.
  packaging:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.packaging == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Packaging script tests
        run: python3 -m unittest discover -s packaging/tests

      - name: Native acceptance helper tests
        run: python3 -m unittest discover -s native/scripts/tests

      - name: Lint the workflows and their shell steps
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

      # Error severity only: the scripts use the `CDPATH= cd` idiom, which
      # shellcheck reports as a warning.
      - name: Shellcheck the packaging scripts
        run: |
          shellcheck --severity=error \
            packaging/archive packaging/stage-archive packaging/write-manifest \
            packaging/verify-archive packaging/make-archive packaging/macos/* \
            native/packaging/macos/build-release native/packaging/macos/build-app-bundle \
            native/scripts/smoke-gui-release native/scripts/smoke-gui-release-macos \
            native/scripts/acceptance/macos-gui-launch \
            web/release/package.sh web/release/install.sh

  # The web control center against the core revision pinned in web/core-sdk.json:
  # the SDK tarballs are packed from that revision and served from the loopback
  # address the pin names, so `bun install --frozen-lockfile` verifies the
  # lockfile integrity against reproducible bytes. The real daemon, worker and
  # CLI come from the same revision.
  web:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Resolve the pinned core revision
        id: core
        run: echo "rev=$(jq -r .coreRev core-sdk.json)" >> "$GITHUB_OUTPUT"

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock', 'web/package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Restore the core binaries
        uses: actions/cache@v4
        with:
          path: web/.core-sdk/core-binaries
          key: web-core-binaries-${{ runner.os }}-${{ steps.core.outputs.rev }}

      # Reuses the restored binaries; otherwise builds them from the pinned
      # revision. The worker lands beside the daemon.
      - name: Build the core binaries
        shell: bash
        run: bun scripts/build-core-binaries.ts | sed -e 's/^export //' -e "s/'//g" >> "$GITHUB_ENV"

      - name: Pack the core SDK tarballs twice and compare
        run: bun scripts/pack-core-sdk.ts --verify-reproducible

      - name: Check the package.json catalog against the pin
        run: bun scripts/sync-core-sdk.ts --check

      - name: Install web dependencies
        run: bun scripts/serve-core-sdk.ts --run bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test

      # The lockfile pins Playwright, so the browser build follows bun.lock.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install Playwright Chromium
        run: bunx playwright install --only-shell chromium

      - name: Browser end-to-end tests
        run: bun run test:e2e

      - name: Backend end-to-end against the real daemon
        run: bun test backend/test/real-daemon.e2e.test.ts
        env:
          POHUNEK_E2E: "1"

      # The release archive for the host platform: builds the SPA, compiles the
      # backend, smoke-tests it against a fixture daemon, and audits the archive.
      - name: Package and audit the release archive
        env:
          POHUNEK_CORE_REF: ${{ steps.core.outputs.rev }}
        run: |
          set -euo pipefail
          bash release/package.sh 0.0.0 linux-x86_64
          ../packaging/check-archive dist/pohunek-web-0.0.0-linux-x86_64.tar.gz \
            --component web --version 0.0.0 --target x86_64-unknown-linux-gnu --core "$POHUNEK_CORE_REF"

  # The compiled backend and the browser suite on Apple Silicon, against the
  # real macOS pohunekd, pohunek-sessiond and pohunek. The runner is ephemeral,
  # so the backend suite may also exercise the owner default runtime directory
  # (`/private/tmp/pohunek-<uid>`), which a developer's own daemon would share.
  web-macos:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.web == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        run: test "$(uname -m)" = "arm64"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Resolve the pinned core revision
        id: core
        run: echo "rev=$(jq -r .coreRev core-sdk.json)" >> "$GITHUB_OUTPUT"

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock', 'web/package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore the core binaries
        uses: actions/cache@v4
        with:
          path: web/.core-sdk/core-binaries
          key: web-core-binaries-${{ runner.os }}-${{ runner.arch }}-${{ steps.core.outputs.rev }}

      - name: Build the core binaries
        shell: bash
        run: bun scripts/build-core-binaries.ts | sed -e 's/^export //' -e "s/'//g" >> "$GITHUB_ENV"

      - name: Pack the core SDK tarballs
        run: bun scripts/pack-core-sdk.ts

      - name: Install web dependencies
        run: bun scripts/serve-core-sdk.ts --run bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/bun.lock') }}

      - name: Install Playwright Chromium
        run: bunx playwright install --only-shell chromium

      - name: Browser end-to-end tests
        run: bun run test:e2e

      # The release package ships this executable: compile it for the native
      # target and smoke it against a fixture daemon, outside the workspace
      # runtime.
      - name: Compile and smoke the packaged backend
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pohunek-web-smoke"
          rm -rf "$out"
          mkdir -p "$out"
          bun build --compile --target=bun-darwin-arm64 \
            --no-compile-autoload-dotenv --no-compile-autoload-bunfig \
            --outfile="$out/pohunek-web" ./backend/src/entrypoint.ts
          file "$out/pohunek-web" | tee /dev/stderr | grep -q "arm64"
          bun run release/smoke.ts "$out/pohunek-web" frontend/dist

      - name: Backend end-to-end against the real daemon
        run: bun test backend/test/real-daemon.e2e.test.ts
        env:
          POHUNEK_E2E: "1"
          POHUNEK_E2E_DEFAULT_RUNTIME: "1"

  native:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.native == 'true' }}
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native
          shared-key: native
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # The loopback and prompt-parity tests drive the real daemon, worker and
      # CLI binaries of the core revision pinned in native/Cargo.toml.
      - name: Resolve the pinned core revision
        id: core
        run: echo "rev=$(grep '^pohunek-protocol = ' Cargo.toml | sed -n -e 's/.*tag = "\([^"]*\)".*/\1/p' -e 's/.*rev = "\([0-9a-f]\{40\}\)".*/\1/p' | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Restore the core binaries
        id: core-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/core-binaries
          key: core-binaries-${{ runner.os }}-${{ steps.core.outputs.rev }}-${{ hashFiles('native/scripts/build-core-binaries') }}

      - name: Build the core binaries
        if: ${{ steps.core-cache.outputs.cache-hit != 'true' }}
        run: scripts/build-core-binaries "$RUNNER_TEMP/core-binaries" > /dev/null

      - name: Locate the core binaries
        run: |
          {
            echo "POHUNEK_DAEMON_BIN=$RUNNER_TEMP/core-binaries/bin/pohunekd"
            echo "POHUNEK_WORKER_BIN=$RUNNER_TEMP/core-binaries/bin/pohunek-sessiond"
            echo "POHUNEK_CLI_BIN=$RUNNER_TEMP/core-binaries/bin/pohunek"
          } >> "$GITHUB_ENV"

      - name: Tests
        run: cargo nextest run --locked --profile ci --workspace --all-features

      - name: Documentation tests
        run: cargo test --locked --doc --workspace

      - name: Release build
        run: cargo build --locked --workspace --release

  native-macos:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.native == 'true' }}
    runs-on: macos-15
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native
          shared-key: native-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # gui-core selects its keyring backend (`apple-native`) only on macOS.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test GUI
        timeout-minutes: 15
        run: cargo test --locked -p pohunek-gui

      # Throwaway keychain for tests/keychain_macos.rs. It becomes the only
      # keychain in the user search list and the user default, so the real
      # keyring backend never sees the runner's login keychain. The password
      # exists only in this step's shell, is masked, and is never written to
      # disk or the environment. The 3600 s auto-lock outlasts a cold build
      # between this step and the test run; the test locks the keychain itself.
      # Only the GUI core test runs while the keychain exists: that test deletes
      # it, so no later step may see a default pointing at a deleted keychain.
      - name: Create throwaway keychain
        shell: bash
        run: |
          set -euo pipefail
          # The file-name marker is defined once, in the test that guards on it.
          marker="$(sed -n 's/^const KEYCHAIN_MARKER: &str = "\(.*\)";$/\1/p' crates/gui-core/tests/keychain_macos.rs)"
          [[ -n "$marker" ]] || { echo "KEYCHAIN_MARKER not found in keychain_macos.rs" >&2; exit 1; }
          keychain="$RUNNER_TEMP/$marker.keychain-db"
          # Exported before the keychain exists so the teardown step can always
          # find it.
          echo "GUI_CORE_TEST_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security list-keychains -d user > "$RUNNER_TEMP/keychains.orig"
          security default-keychain -d user > "$RUNNER_TEMP/keychain-default.orig"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -t 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"

      - name: Test GUI core keychain backend
        timeout-minutes: 15
        # The loopback and prompt-parity binaries need the core binaries and run
        # on Linux; this job runs the library tests and the keychain test.
        run: cargo test --locked --no-fail-fast -p pohunek-gui-core --lib --test keychain_macos

      # Deletes the throwaway keychain, restores the runner's keychain list and
      # default, then re-reads both and fails the step when they differ from the
      # saved originals. Each action runs even if an earlier one failed.
      - name: Remove throwaway keychain
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          fail() { echo "::error::$1"; failures=1; }
          # Strips the indentation and quotes `security` prints around a path;
          # spaces inside the path are kept.
          normalize() {
            sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' | sed -e '/^$/d'
          }

          keychain="${GUI_CORE_TEST_KEYCHAIN:-}"
          if [[ -n "$keychain" && -e "$keychain" ]]; then
            security delete-keychain "$keychain" || fail "could not delete $keychain"
            rm -f "$keychain" || fail "could not remove $keychain"
          fi

          list_file="$RUNNER_TEMP/keychains.orig"
          default_file="$RUNNER_TEMP/keychain-default.orig"
          if [[ ! -f "$list_file" || ! -f "$default_file" ]]; then
            echo "no saved keychain state: the create step did not change it"
            exit "$failures"
          fi

          originals=()
          while IFS= read -r line; do
            originals+=("$line")
          done < <(normalize < "$list_file")
          default="$(normalize < "$default_file" | head -n 1)"

          if (( ${#originals[@]} > 0 )); then
            security list-keychains -d user -s "${originals[@]}" || fail "could not restore the keychain search list"
          fi
          if [[ -n "$default" ]]; then
            security default-keychain -d user -s "$default" || fail "could not restore the default keychain"
          fi

          if ! diff <(security list-keychains -d user | normalize) <(normalize < "$list_file"); then
            fail "keychain search list differs from the saved original"
          fi
          if ! diff <(security default-keychain -d user | normalize) <(normalize < "$default_file"); then
            fail "default keychain differs from the saved original"
          fi
          exit "$failures"

  # The macOS release packaging path with the real codesign: each component is
  # staged, ad-hoc signed by `package --adhoc-release`, and the archive is
  # checked and extracted so `verify-signed --adhoc` inspects the shipped bytes.
  # The path filter is wider than the surface jobs because the signing scripts
  # only run for real here.
  macos-package:
    name: macOS ad-hoc signing (${{ matrix.component }})
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.macos_package == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        component: [gui, web]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        run: test "$(uname -m)" = "arm64"

      - name: Resolve the version and the core pin
        id: pin
        run: |
          set -euo pipefail
          packaging/core-pin --require-web | tee -a "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: matrix.component == 'gui'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Cache cargo build
        if: matrix.component == 'gui'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native
          shared-key: release-macos-gui
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the GUI
        if: matrix.component == 'gui'
        id: build
        run: |
          set -euo pipefail
          bindir="$(native/packaging/macos/build-release)"
          echo "bindir=$bindir" >> "$GITHUB_OUTPUT"

      - name: Install Bun
        if: matrix.component == 'web'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Pack the core SDK tarballs
        if: matrix.component == 'web'
        working-directory: web
        run: bun scripts/pack-core-sdk.ts

      - name: Install web dependencies
        if: matrix.component == 'web'
        working-directory: web
        run: bun scripts/serve-core-sdk.ts --run bun install --frozen-lockfile

      - name: Build the web control center input tree
        if: matrix.component == 'web'
        id: webinput
        env:
          VERSION: ${{ steps.pin.outputs.native_version }}
        run: bash web/release/package.sh "$VERSION" aarch64-apple-darwin --input-only

      - name: Stage, ad-hoc sign, and verify
        id: package
        env:
          COMPONENT: ${{ matrix.component }}
          VERSION: ${{ steps.pin.outputs.native_version }}
          POHUNEK_CORE_REF: ${{ steps.pin.outputs.core_ref }}
          GUI_BINDIR: ${{ steps.build.outputs.bindir }}
          WEB_INPUT: ${{ steps.webinput.outputs.input }}
        run: |
          set -euo pipefail
          if [ "$COMPONENT" = web ]; then
            input="$WEB_INPUT"
          else
            input="$GUI_BINDIR"
          fi
          mkdir -p dist
          staging="$(packaging/macos/package --stage-release "$COMPONENT" "$VERSION" "$input" dist)"
          archive="$(packaging/macos/package --adhoc-release "$COMPONENT" "$VERSION" "$staging")"
          packaging/macos/verify-signed --adhoc "$staging"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Check the archive and verify the extracted signatures
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          COMPONENT: ${{ matrix.component }}
          VERSION: ${{ steps.pin.outputs.native_version }}
          POHUNEK_CORE_REF: ${{ steps.pin.outputs.core_ref }}
        run: |
          set -euo pipefail
          packaging/check-archive "$ARCHIVE" --component "$COMPONENT" --version "$VERSION" \
            --target aarch64-apple-darwin --signing adhoc --core "$POHUNEK_CORE_REF"
          extract_dir="$(mktemp -d)"
          trap 'rm -rf "$extract_dir"' EXIT
          tar -xzf "$ARCHIVE" -C "$extract_dir"
          root="$extract_dir/$(basename "$ARCHIVE" .tar.gz)"
          grep -q '^signing adhoc$' "$root/MANIFEST"
          packaging/macos/verify-signed --adhoc "$root"

  ci:
    if: ${{ always() }}
    needs: [changes, plugin, launchers, native, native-macos, web, web-macos, packaging, macos-package]
    runs-on: ubuntu-latest
    steps:
      # A skipped surface job is a pass; a failed or cancelled one is not.
      - name: Require every surface job to have passed or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "job result: $r"; exit 1 ;;
            esac
          done
