name: CI

# Every surface lives in its own top-level folder and has its own job. A
# pull request runs a surface's job only when that surface (or the workflow
# itself) changes; pushes to main, the weekly schedule and manual dispatch run
# every job. The `ci` job always runs and is the single required check, so a
# skipped surface never leaves a missing status.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plugin: ${{ steps.filter.outputs.plugin }}
      launchers: ${{ steps.filter.outputs.launchers }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      # Push events resolve the filter with git against the previous commit,
      # which needs more than a depth-1 checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            plugin:
              - 'plugin/**'
              - 'launchers/**'
              - '.github/workflows/ci.yml'
            launchers:
              - 'launchers/**'
              - '.github/workflows/ci.yml'
            native:
              - 'native/**'
              - '.github/workflows/ci.yml'

  plugin:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.plugin == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: plugin/package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

  launchers:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.launchers == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shell: dash, render: true }
          - { os: ubuntu-latest, shell: bash, render: true }
          - { os: macos-latest, shell: /bin/sh, render: false }
    runs-on: ${{ matrix.os }}
    env:
      # The rendering tests drive the real `pohunek prompt` CLI; this is the
      # core release they are pinned to. Bump it together with the digest.
      POHUNEK_RELEASE: v0.31.6
      POHUNEK_MUSL_SHA256: fc0a53a98ed0d2b6123d78e338f3fa6bc44277df8d5a7c68c6c250f4b097a428
    defaults:
      run:
        working-directory: launchers
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: launchers/package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - name: Install the pohunek release binary
        if: ${{ matrix.render }}
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="pohunek-cli-${POHUNEK_RELEASE#v}-x86_64-unknown-linux-musl.tar.gz"
          gh release download "$POHUNEK_RELEASE" -R zajca/pohunek -p "$asset"
          echo "$POHUNEK_MUSL_SHA256  $asset" | sha256sum -c -
          tar xzf "$asset"
          echo "POHUNEK_TEST_BIN=$PWD/${asset%.tar.gz}/pohunek" >> "$GITHUB_ENV"
      - name: Launcher tests under ${{ matrix.shell }}
        env:
          POHUNEK_TEST_SHELL: ${{ matrix.shell }}
        run: |
          if [ "${{ matrix.render }}" = "true" ]; then
            bun test
          else
            bun test tests/launcher-scripts.test.ts tests/lib-timeout.test.ts
          fi

  native:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.native == 'true' }}
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native
          shared-key: native
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # The loopback and prompt-parity tests drive the real daemon, worker and
      # CLI binaries of the core revision pinned in native/Cargo.toml.
      - name: Resolve the pinned core revision
        id: core
        run: echo "rev=$(sed -n 's/^pohunek-protocol = .*rev = "\([0-9a-f]\{40\}\)".*/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Restore the core binaries
        id: core-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/core-binaries
          key: core-binaries-${{ runner.os }}-${{ steps.core.outputs.rev }}-${{ hashFiles('native/scripts/build-core-binaries') }}

      - name: Build the core binaries
        if: ${{ steps.core-cache.outputs.cache-hit != 'true' }}
        run: scripts/build-core-binaries "$RUNNER_TEMP/core-binaries" > /dev/null

      - name: Locate the core binaries
        run: |
          {
            echo "POHUNEK_DAEMON_BIN=$RUNNER_TEMP/core-binaries/bin/pohunekd"
            echo "POHUNEK_WORKER_BIN=$RUNNER_TEMP/core-binaries/bin/pohunek-sessiond"
            echo "POHUNEK_CLI_BIN=$RUNNER_TEMP/core-binaries/bin/pohunek"
          } >> "$GITHUB_ENV"

      - name: Tests
        run: cargo nextest run --locked --profile ci --workspace --all-features

      - name: Documentation tests
        run: cargo test --locked --doc --workspace

      - name: Release build
        run: cargo build --locked --workspace --release

  native-macos:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.native == 'true' }}
    runs-on: macos-15
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native
          shared-key: native-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # gui-core selects its keyring backend (`apple-native`) only on macOS.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test GUI
        timeout-minutes: 15
        run: cargo test --locked -p pohunek-gui

      # Throwaway keychain for tests/keychain_macos.rs. It becomes the only
      # keychain in the user search list and the user default, so the real
      # keyring backend never sees the runner's login keychain. The password
      # exists only in this step's shell, is masked, and is never written to
      # disk or the environment. The 3600 s auto-lock outlasts a cold build
      # between this step and the test run; the test locks the keychain itself.
      # Only the GUI core test runs while the keychain exists: that test deletes
      # it, so no later step may see a default pointing at a deleted keychain.
      - name: Create throwaway keychain
        shell: bash
        run: |
          set -euo pipefail
          # The file-name marker is defined once, in the test that guards on it.
          marker="$(sed -n 's/^const KEYCHAIN_MARKER: &str = "\(.*\)";$/\1/p' crates/gui-core/tests/keychain_macos.rs)"
          [[ -n "$marker" ]] || { echo "KEYCHAIN_MARKER not found in keychain_macos.rs" >&2; exit 1; }
          keychain="$RUNNER_TEMP/$marker.keychain-db"
          # Exported before the keychain exists so the teardown step can always
          # find it.
          echo "GUI_CORE_TEST_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security list-keychains -d user > "$RUNNER_TEMP/keychains.orig"
          security default-keychain -d user > "$RUNNER_TEMP/keychain-default.orig"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -t 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"

      - name: Test GUI core keychain backend
        timeout-minutes: 15
        # The loopback and prompt-parity binaries need the core binaries and run
        # on Linux; this job runs the library tests and the keychain test.
        run: cargo test --locked --no-fail-fast -p pohunek-gui-core --lib --test keychain_macos

      # Deletes the throwaway keychain, restores the runner's keychain list and
      # default, then re-reads both and fails the step when they differ from the
      # saved originals. Each action runs even if an earlier one failed.
      - name: Remove throwaway keychain
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          fail() { echo "::error::$1"; failures=1; }
          # Strips the indentation and quotes `security` prints around a path;
          # spaces inside the path are kept.
          normalize() {
            sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' | sed -e '/^$/d'
          }

          keychain="${GUI_CORE_TEST_KEYCHAIN:-}"
          if [[ -n "$keychain" && -e "$keychain" ]]; then
            security delete-keychain "$keychain" || fail "could not delete $keychain"
            rm -f "$keychain" || fail "could not remove $keychain"
          fi

          list_file="$RUNNER_TEMP/keychains.orig"
          default_file="$RUNNER_TEMP/keychain-default.orig"
          if [[ ! -f "$list_file" || ! -f "$default_file" ]]; then
            echo "no saved keychain state: the create step did not change it"
            exit "$failures"
          fi

          originals=()
          while IFS= read -r line; do
            originals+=("$line")
          done < <(normalize < "$list_file")
          default="$(normalize < "$default_file" | head -n 1)"

          if (( ${#originals[@]} > 0 )); then
            security list-keychains -d user -s "${originals[@]}" || fail "could not restore the keychain search list"
          fi
          if [[ -n "$default" ]]; then
            security default-keychain -d user -s "$default" || fail "could not restore the default keychain"
          fi

          if ! diff <(security list-keychains -d user | normalize) <(normalize < "$list_file"); then
            fail "keychain search list differs from the saved original"
          fi
          if ! diff <(security default-keychain -d user | normalize) <(normalize < "$default_file"); then
            fail "default keychain differs from the saved original"
          fi
          exit "$failures"

  ci:
    if: ${{ always() }}
    needs: [changes, plugin, launchers, native, native-macos]
    runs-on: ubuntu-latest
    steps:
      # A skipped surface job is a pass; a failed or cancelled one is not.
      - name: Require every surface job to have passed or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "job result: $r"; exit 1 ;;
            esac
          done
