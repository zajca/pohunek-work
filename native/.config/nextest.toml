# `flaky-result` was introduced in this version.
nextest-version = { required = "0.9.131" }

[profile.default]
test-threads = 4
slow-timeout = { period = "60s", terminate-after = 3 }
# A test that fails and then passes on a retry is reported as FLAKY and still
# fails the run. Retries only tell "fails every time" apart from "fails
# sometimes"; they never turn a failure green.
flaky-result = "fail"

[profile.ci]
test-threads = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
