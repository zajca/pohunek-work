# pohunek native GUI workspace.
#
# The Iced control-plane GUI and its headless core. It consumes the pohunek
# core crates (protocol, client, paths, platform, prompt, assistant) as git
# dependencies pinned to one revision and has its own version, lockfile and
# toolchain settings; nothing in it is shared with the core workspace.
[workspace]
resolver = "2"
members = ["crates/gui", "crates/gui-core"]

[workspace.dependencies]
# Core crates share one revision so the native client and web SDK use the same contract.
pohunek-assistant = { git = "https://github.com/zajca/pohunek", rev = "2a81f1eeab504570381327c9bdf1080c3f7f13b8" }
pohunek-client = { git = "https://github.com/zajca/pohunek", rev = "2a81f1eeab504570381327c9bdf1080c3f7f13b8" }
pohunek-paths = { git = "https://github.com/zajca/pohunek", rev = "2a81f1eeab504570381327c9bdf1080c3f7f13b8" }
pohunek-platform = { git = "https://github.com/zajca/pohunek", rev = "2a81f1eeab504570381327c9bdf1080c3f7f13b8" }
pohunek-prompt = { git = "https://github.com/zajca/pohunek", rev = "2a81f1eeab504570381327c9bdf1080c3f7f13b8" }
pohunek-protocol = { git = "https://github.com/zajca/pohunek", rev = "2a81f1eeab504570381327c9bdf1080c3f7f13b8" }
pohunek-test-support = { git = "https://github.com/zajca/pohunek", rev = "2a81f1eeab504570381327c9bdf1080c3f7f13b8" }

pohunek-gui-core = { path = "crates/gui-core" }

base64 = "0.22"
futures = "0.3"
getrandom = "0.2"
iced = { version = "0.14", default-features = false }
keyring = { version = "3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "fs", "time", "process"] }
toml = "0.8"
tracing = "0.1"

# Released version of the GUI, independent of the core version. The MIT license
# text is kept in LICENSES/pohunek-core-MIT.txt at the repository root.
[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"
rust-version = "1.96"

# Workspace-wide lint policy (M-STATIC-VERIFICATION). Every crate opts in via
# `[lints] workspace = true`, so the set lives here once instead of being
# duplicated as `#![warn(...)]` headers across crates. Per-crate `unsafe_code`
# posture stays as an inner attribute, since libs forbid it while the daemon/cli
# deny-with-localized-opt-in.
[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
# Not part of the upstream set, but the project relied on it via per-crate
# headers before centralizing here.
unreachable_pub = "warn"
rust_2018_idioms = "warn"

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Restriction-group lints that drive up consistency and brevity.
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
# Flags clones that only copy a borrowed string.
implicit_clone = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# Avoids false positives with the structured-logging message templates.
literal_string_with_formatting_args = "allow"
# `assert!(x.is_empty())` is the idiomatic emptiness check in tests; the
# lint's `assert_eq!(x, [] as [T; 0])` replacement needs a spelled-out element
# type at every site and reads worse than the assertion it replaces.
assert_is_empty = "allow"

# Custom opt-outs (case-by-case, per M-STATIC-VERIFICATION). These are binary
# crates and unpublished internal libs, so the public-API doc lints below would
# be pure noise rather than catching real contract gaps.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# Line tables keep file:line panic and RUST_BACKTRACE frames for workspace
# crates while skipping the variable/type DWARF that dominates dev codegen,
# link time and target/ size. `test` inherits this profile.
[profile.dev]
debug = "line-tables-only"

# `"*"` matches only non-workspace packages; dependencies are rarely stepped
# through.
[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 2
