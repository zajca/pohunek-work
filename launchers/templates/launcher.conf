# pohunek launcher configuration.
# Lines are key=value; '#' starts a comment. Edit the values below.

# --- Required ---
# Default host: 'local' or a NetBird peer name
host=local
# Terminal emulator command (falls back to $TERMINAL if empty)
terminal=
# Per-host timeout (seconds) for `session list` queries in the rofi switcher
list_timeout_seconds=5

# --- Required only by the issue picker (pohunek-rofi-issue <project> <linear|github>) ---
# Linear CLI binary: the linear source, and pohunek-launch-issue.
linear_cli=linear
# pohunek-work binary: the issue picker and new-session keybind run it.
pohunek_work_bin=pohunek-work

# --- Optional (defaults shown) ---
#pohunek_bin=pohunek
#gh_bin=gh
#rofi_bin=rofi
#swaymsg_bin=swaymsg
#yes=false
# Issue picker (pohunek-rofi-issue): assignee whose issues are listed.
# Empty = derive from `linear auth whoami`.
#linear_assignee=
# Issue picker: which Linear workflow-state types are 'actionable' (space-separated:
# triage backlog unstarted started completed canceled).
#linear_issue_states=started unstarted
# `pohunek attach` reconnect settings live in core's attach.conf, not here.
#mark_retry_count=20
#mark_retry_interval_seconds=0.1
